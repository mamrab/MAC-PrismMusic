name: macOS Build

# Builds the PrismMusic macOS desktop app (Tauri) and produces a packaged DMG.
# No code signing certificate is required.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build macOS App (Tauri)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout MAC-PrismMusic (Tauri configuration)
        uses: actions/checkout@v4

      - name: Checkout Next.js Frontend (Private Repository)
        uses: actions/checkout@v4
        with:
          repository: apofeoziy/PrismMusic
          path: PrismMusic
          token: ${{ secrets.GH_PAT }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: PrismMusic/pnpm-lock.yaml

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Build Next.js Frontend
        run: |
          cd PrismMusic
          pnpm install --frozen-lockfile
          node build-tauri.js

      - name: Position static files for Tauri
        run: |
          mkdir -p ../out
          cp -R PrismMusic/out/* ../out/
          echo "=== Static assets ready at ../out ==="
          ls -la ../out | head -20

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Build Tauri macOS application
        run: |
          npx tauri build --target universal-apple-darwin
        env:
          # Disable code signing requirement for development / unsigned builds
          APPLE_DEVELOPMENT_TEAM: ""

      - name: Locate built DMG
        id: locate_dmg
        run: |
          DMG_PATH=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -type f -name "*.dmg" | head -n 1)
          if [ -z "$DMG_PATH" ]; then
            echo "::error::DMG not found in target folder."
            find src-tauri/target -type f -name "*.dmg" || true
            exit 1
          fi
          echo "Found DMG at: $DMG_PATH"
          cp "$DMG_PATH" "$GITHUB_WORKSPACE/PrismMusic-macOS.dmg"
          echo "dmg_path=$GITHUB_WORKSPACE/PrismMusic-macOS.dmg" >> "$GITHUB_OUTPUT"

      - name: Upload macOS App DMG
        uses: actions/upload-artifact@v4
        with:
          name: PrismMusic-macOS-Tauri-${{ github.sha }}
          path: PrismMusic-macOS.dmg
          if-no-files-found: error
          retention-days: 30
